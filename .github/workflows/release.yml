name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libgtk-3-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev wget

      - name: Build AppImage
        run: bash build-appimage.sh

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: SteamArt-*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
